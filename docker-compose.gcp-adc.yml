# SPDX-License-Identifier: Apache-2.0
# Optional: Google Cloud Application Default Credentials for the BigQuery (and Cloud
# Spanner) connectors when the stack runs in Docker Compose. Upstream's
# docker-compose.yml is unchanged; this file is layered on top.
#
#   GCP_CREDENTIALS_FILE=$HOME/.config/gcloud/application_default_credentials.json \
#     docker compose -f docker-compose.yml -f docker-compose.litellm.yml \
#       -f docker-compose.gcp-adc.yml up -d
#
# GCP_CREDENTIALS_FILE is a credentials JSON on the host: the file `gcloud auth
# application-default login` writes, or a service-account key. It is mounted read-only
# into the two services that open source connections, and GOOGLE_APPLICATION_CREDENTIALS
# points the Google client libraries at it. Compose refuses to start when it is unset.
#
# GOOGLE_CLOUD_QUOTA_PROJECT is optional: the project billed for API quota when the
# credentials are a user's. Empty is the same as unset to google-auth.
#
# The containers run as uid 1000 (user auto_ontology). On Docker Desktop a bind-mounted
# file is readable by it. On Linux the file must be readable by uid 1000; gcloud writes
# it with mode 0600 for your own user.

x-gcp-adc: &gcp-adc
  volumes:
    - type: bind
      source: ${GCP_CREDENTIALS_FILE:?set GCP_CREDENTIALS_FILE to a Google credentials JSON file on the host}
      target: /etc/gcp/credentials.json
      read_only: true
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: /etc/gcp/credentials.json
    GOOGLE_CLOUD_QUOTA_PROJECT: ${GOOGLE_CLOUD_QUOTA_PROJECT:-}

services:
  auto-ontology: *gcp-adc
  ingestion-service: *gcp-adc
